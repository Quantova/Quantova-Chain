[workspace]
resolver = "2"
members = ["crates/qtv-idfmt", "crates/qtv-codec", "crates/qtv-account", "crates/qtv-tx", "crates/qtv-block", "crates/qtv-state", "crates/qtv-staking", "crates/qtv-governance", "crates/qtv-store", "crates/qtv-node", "crates/qtv-net", "crates/qtv-devnet", "crates/qtv-live", "crates/qtv-loopback", "crates/qtv-widearea", "crates/qtv-daemon", "crates/qtv-gateway"]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Quantova/Quantova-Chain"

# The hash based verifiable random function in qtv-crypto is heavy without
# optimization, and the node drives it once per validator per height. Optimize
# the crypto dependency in dev and test builds so the node loop and its tests run
# in reasonable time, while our own crates stay debuggable.
[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.test.package.qtv-crypto]
opt-level = 3

# Local override to build against the QRC-CONSENSUS working tree that binds
# validator key material to a per validator secret. Before release this override is
# dropped and the git tag pin in each crate is bumped to the tag that carries the
# change.
[patch."https://github.com/Quantova/QRC-CONSENSUS.git"]
qtv-bft = { path = "../QRC-CONSENSUS/crates/qtv-bft" }
qtv-sampler = { path = "../QRC-CONSENSUS/crates/qtv-sampler" }
qtv-attest = { path = "../QRC-CONSENSUS/crates/qtv-attest" }
