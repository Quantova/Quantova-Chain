name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: 5634db731274589aec34601e53a5ea05fc252c4d
          path: QVM
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: fmt
        working-directory: Quantova-Chain
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: Quantova-Chain
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: Quantova-Chain
        run: cargo test --workspace --all-features --locked
      - name: harness
        working-directory: Quantova-Chain/harness
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
      - name: test attributes
        working-directory: Quantova-Chain
        run: |
          find crates -name '*.rs' -print0 | xargs -0 awk 'FNR==1{prev=""} /^[[:space:]]*fn (a|an)_[a-z0-9_]*\(\)/ { if (prev !~ /#\[test\]|#\[should_panic|#\[ignore/) { print FILENAME":"FNR": "$0; bad=1 } } { if ($0 !~ /^[[:space:]]*$/) prev=$0 } END { exit bad }'
      - name: supply chain gate
        working-directory: Quantova-Chain
        run: |
          cargo install cargo-deny --version 0.19.9 --locked
          cargo deny --locked check bans licenses sources advisories
