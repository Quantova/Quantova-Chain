name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: 2c12040388dd6e6156fc690c47cf3003a356cb61
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: a98e42130d353ab563b8990df84ffb0b66676c4d
          path: QVM
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        working-directory: Quantova-Chain
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: Quantova-Chain
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: Quantova-Chain
        run: cargo test --workspace --all-features --locked
      - name: relay
        working-directory: Quantova-Chain/crates/qtv-bridge-relay
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: supply chain gate
        working-directory: Quantova-Chain
        run: |
          cargo install cargo-deny --version 0.19.9 --locked
          cargo deny --locked check bans licenses sources advisories
