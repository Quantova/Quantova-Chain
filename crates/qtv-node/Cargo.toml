[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
test-fixtures = ["qtv-attest/test-fixtures"]

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "28c0fff8f620c1663663f4bd271b7bae3dbddc80" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "5634db731274589aec34601e53a5ea05fc252c4d" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "1c0ae3504f9ba07e69d39e8df5fcbccf65248b12" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "1c0ae3504f9ba07e69d39e8df5fcbccf65248b12" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "1c0ae3504f9ba07e69d39e8df5fcbccf65248b12" }

[dev-dependencies]
qtv-node = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
