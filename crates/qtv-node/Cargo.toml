[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
test-fixtures = []

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4abe71e9fa84a6e670e6d5736d7533c3fd10a3ed" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "faf4870915c3419fa5e350e3257bfffd1074fe1f" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0972892e90e4a03a2620a5588715a1cdb658f935" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0972892e90e4a03a2620a5588715a1cdb658f935" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0972892e90e4a03a2620a5588715a1cdb658f935" }

[dev-dependencies]
qtv-node = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
