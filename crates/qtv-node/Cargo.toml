[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
test-fixtures = []

[dependencies]
qtv-btc-spv = { path = "../qtv-btc-spv" }
qlc-ethereum = { path = "../qlc-ethereum" }
q-bls = { path = "../q-bls" }
qlc-cosmos = { path = "../qlc-cosmos" }
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "37a7a4963888a4bb0854d346583e26928659aa63" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "06d22c768a1f05b81cd89bb154c6f0e35d7fa8f5" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "b97713f1862116daed1c901b280caf94d4e352cc" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "b97713f1862116daed1c901b280caf94d4e352cc" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "b97713f1862116daed1c901b280caf94d4e352cc" }

[dev-dependencies]
qtv-node = { path = ".", features = ["test-fixtures"] }
qlc-ethereum = { path = "../qlc-ethereum", features = ["test-util"] }
q-bls = { path = "../q-bls", features = ["test-util"] }
qlc-cosmos = { path = "../qlc-cosmos", features = ["test-util"] }

[lints]
workspace = true
