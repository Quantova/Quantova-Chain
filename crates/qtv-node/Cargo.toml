[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
test-fixtures = ["qtv-attest/test-fixtures"]

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "e47d6cd94e71c13b22e2990f8c2b0a2e3a2204d0" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "8c6eb5c003f1753bc23129ca02bb3610faf1cc9f" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "9a4337fe0945609d21c0b8b12b1c41816cfc57ae" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "9a4337fe0945609d21c0b8b12b1c41816cfc57ae" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "9a4337fe0945609d21c0b8b12b1c41816cfc57ae" }

[dev-dependencies]
qtv-node = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
