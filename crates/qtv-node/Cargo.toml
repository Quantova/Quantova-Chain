[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
test-fixtures = ["qtv-attest/test-fixtures"]

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4e37c52984740f345f96e2c8536803bce5f3b805" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "94fe7e8a1758deca56910f2a5c634622345404ef" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "8e998f97b5df74f8181c69ea980c0aaa1c120e2c" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "8e998f97b5df74f8181c69ea980c0aaa1c120e2c" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "8e998f97b5df74f8181c69ea980c0aaa1c120e2c" }

[dev-dependencies]
qtv-node = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
