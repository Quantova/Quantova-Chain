[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
# Deterministic, per index secret and validator constructors for the test suite and
# the single process simulation. Off by default, so a default node build carries no id
# derived key path; the secret comes only from a keystore file or an explicit caller.
test-fixtures = []

[dependencies]
qtv-btc-spv = { path = "../qtv-btc-spv" }
qlc-ethereum = { path = "../qlc-ethereum" }
q-bls = { path = "../q-bls" }
qlc-cosmos = { path = "../qlc-cosmos" }
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "292594d18080179e304576164f44703d410d919f" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "f617f96ba5c2ec36d0bebb3821a315f987cb58a4" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "c1348ca801e7f97ed47572ae19c09bb7ea42a60d" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "c1348ca801e7f97ed47572ae19c09bb7ea42a60d" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "c1348ca801e7f97ed47572ae19c09bb7ea42a60d" }

[dev-dependencies]
# Enable the test only fixtures for this crate's own integration tests, the standard
# way to turn a feature on for a crate testing itself.
qtv-node = { path = ".", features = ["test-fixtures"] }
qlc-ethereum = { path = "../qlc-ethereum", features = ["test-util"] }
q-bls = { path = "../q-bls", features = ["test-util"] }
qlc-cosmos = { path = "../qlc-cosmos", features = ["test-util"] }

[lints]
workspace = true
