[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
test-fixtures = []

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "e4575391affdc6d591183e75dad5ada227165631" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "6564032c49495aff8f8a96791f8a30b2222badca" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "817ae56c663e8537fe7a7903ecafa930ff8ead7c" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "817ae56c663e8537fe7a7903ecafa930ff8ead7c" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "817ae56c663e8537fe7a7903ecafa930ff8ead7c" }

[dev-dependencies]
qtv-node = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
