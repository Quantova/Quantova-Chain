[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
test-fixtures = []

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "e6652598dc3847189609a282128921824d55c10b" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "3e8d8f194f93dad40fed826b021f058e5728f513" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0749e0ac62fc0f0a3edd9ec86846a4d55d4f1180" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0749e0ac62fc0f0a3edd9ec86846a4d55d4f1180" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "0749e0ac62fc0f0a3edd9ec86846a4d55d4f1180" }

[dev-dependencies]
qtv-node = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
