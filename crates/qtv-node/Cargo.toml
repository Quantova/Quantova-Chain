[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", tag = "v0.1.0" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", tag = "v0.2.0" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", tag = "v0.2.0" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", tag = "v0.2.0" }
