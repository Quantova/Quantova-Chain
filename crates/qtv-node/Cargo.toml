[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
test-fixtures = []

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "387c01dee92bd3a7e5a6bf5a1480745ccafa0d5f" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "a98e42130d353ab563b8990df84ffb0b66676c4d" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "7f21781856fc50a2f8267d35ac4416c5d6ba9d27" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "7f21781856fc50a2f8267d35ac4416c5d6ba9d27" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "7f21781856fc50a2f8267d35ac4416c5d6ba9d27" }

[dev-dependencies]
qtv-node = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
