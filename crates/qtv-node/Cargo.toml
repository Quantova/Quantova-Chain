[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
# Deterministic, per index secret and validator constructors for the test suite and
# the single process simulation. Off by default, so a default node build carries no id
# derived key path; the secret comes only from a keystore file or an explicit caller.
test-fixtures = []

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "21e28f1ffd1ca46a7144136c483618b18cd29bae" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "a4b6b42f4c5aeb0104b035f26b26f5bf2430a8ab" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fdee0ee1f9684eeeb1f6cf1ea402f515e87c10b1" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fdee0ee1f9684eeeb1f6cf1ea402f515e87c10b1" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fdee0ee1f9684eeeb1f6cf1ea402f515e87c10b1" }

[dev-dependencies]
# Enable the test only fixtures for this crate's own integration tests, the standard
# way to turn a feature on for a crate testing itself.
qtv-node = { path = ".", features = ["test-fixtures"] }
