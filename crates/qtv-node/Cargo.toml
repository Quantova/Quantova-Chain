[package]
name = "qtv-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first in process node that composes the chain crates, the virtual machine, and the consensus core into a state transition and finalization loop."

[features]
test-fixtures = []

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-staking = { path = "../qtv-staking" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "12fefda211c5b7f8a8e9ed60e6a35d880da54c38" }
qtv-vm = { git = "https://github.com/Quantova/QVM.git", rev = "f7d82abb13a01039d78dca732660fd6700d7b830" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "96370aeb7bb23e04ee177d3945659e5d53fdf09f" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "96370aeb7bb23e04ee177d3945659e5d53fdf09f" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "96370aeb7bb23e04ee177d3945659e5d53fdf09f" }

[dev-dependencies]
qtv-node = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
