[package]
name = "qtv-bridge-relay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[dependencies]
qtv-node = { path = "../qtv-node" }
qcore = { path = "../../../QCore.rs", features = ["client"] }

[dev-dependencies]
qtv-devnet = { path = "../qtv-devnet" }

# Excluded from the chain workspace because it reaches a sibling checkout
# (QCore.rs) that a clean clone of this repo does not have. Keeping it a member
# made cargo metadata fail for anyone cloning the node, so it roots its own
# workspace and is built from its own directory.
[workspace]
