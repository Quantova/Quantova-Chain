[package]
name = "qtv-live"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A live in process multi node harness that stands up several real validator instances over the real post quantum transport, runs real committee sortition, block production, module lattice attestation, and aggregated finality, and measures the wall clock sustained finalised throughput and the finality distribution with its tail. It measures; it does not tune."

[[bin]]
name = "qtv-live"
path = "src/main.rs"

[dependencies]
qtv-account = { path = "../qtv-account" }
qtv-codec = { path = "../qtv-codec" }
qtv-tx = { path = "../qtv-tx" }
qtv-node = { path = "../qtv-node", features = ["test-fixtures"] }

qtv-devnet = { path = "../qtv-devnet", features = ["test-fixtures"] }
qtv-loopback = { path = "../qtv-loopback" }

qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "f30f372f643519dc968c9433570a85eff7785323" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "f30f372f643519dc968c9433570a85eff7785323" }

[lints]
workspace = true
