[package]
name = "qtv-account"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The account model and key derivation pipeline for the Quantova stack."

[features]
default = []
fn-dsa = ["qtv-crypto/fn-dsa"]

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "7ac1ed92287e8edf2a96f6cff7f9f19281744a9d" }
qtv-idfmt = { path = "../qtv-idfmt" }
zeroize = "1"
