[package]
name = "qtv-devnet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A multi node devnet where several nodes gossip transactions, block proposals, and attestations over the qtv-net post-quantum channel, reach the same finalized chain, and persist it through qtv-store."

[features]
# Deterministic, per id node identities and constructors for the test suite and the
# single process simulation. Off by default, so a default build carries no id derived
# key path. Propagates to the node fixtures the devnet composes.
test-fixtures = ["qtv-node/test-fixtures"]

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-node = { path = "../qtv-node" }
qtv-governance = { path = "../qtv-governance" }
qtv-staking = { path = "../qtv-staking" }
qtv-net = { path = "../qtv-net" }
qtv-store = { path = "../qtv-store" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "292594d18080179e304576164f44703d410d919f" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "c1348ca801e7f97ed47572ae19c09bb7ea42a60d" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "c1348ca801e7f97ed47572ae19c09bb7ea42a60d" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "c1348ca801e7f97ed47572ae19c09bb7ea42a60d" }

[dev-dependencies]
# Enable the test only fixtures for this crate's own integration tests.
qtv-devnet = { path = ".", features = ["test-fixtures"] }

[lints]
workspace = true
