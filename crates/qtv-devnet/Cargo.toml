[package]
name = "qtv-devnet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A multi node devnet where several nodes gossip transactions, block proposals, and attestations over the qtv-net post-quantum channel, reach the same finalized chain, and persist it through qtv-store."

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-block = { path = "../qtv-block" }
qtv-state = { path = "../qtv-state" }
qtv-node = { path = "../qtv-node" }
qtv-net = { path = "../qtv-net" }
qtv-store = { path = "../qtv-store" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", tag = "v0.3.0" }
qtv-bft = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", tag = "v0.4.0" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", tag = "v0.4.0" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", tag = "v0.4.0" }
