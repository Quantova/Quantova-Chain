[package]
name = "qtv-tx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The transaction body, wrapper, signing, and verification for the Quantova stack."

[features]
default = []
fn-dsa = ["qtv-account/fn-dsa", "qtv-crypto/fn-dsa"]

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4c0bdcb7dce9d2de6f9f510b0695377321076fef" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-idfmt = { path = "../qtv-idfmt" }
