[package]
name = "qtv-tx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The transaction body, wrapper, signing, and verification for the Quantova stack."

[features]
default = []
fn-dsa = ["qtv-account/fn-dsa", "qtv-crypto/fn-dsa"]

[dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "21e28f1ffd1ca46a7144136c483618b18cd29bae" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-idfmt = { path = "../qtv-idfmt" }
zeroize = "1"
