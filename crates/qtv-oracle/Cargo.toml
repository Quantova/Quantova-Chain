[package]
name = "qtv-oracle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Q-Oracle bridge signer: generates an operator committee, builds the CommitteeRotate registration, and signs bridge deposit mints the chain admits on quorum."

[[bin]]
name = "qtv-oracle"
path = "src/main.rs"

[dependencies]
qtv-idfmt = { path = "../qtv-idfmt" }
qtv-wipe = { path = "../qtv-wipe" }
qtv-codec = { path = "../qtv-codec" }
qtv-account = { path = "../qtv-account" }
qtv-tx = { path = "../qtv-tx" }
qtv-node = { path = "../qtv-node" }
qtv-governance = { path = "../qtv-governance" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "e47d6cd94e71c13b22e2990f8c2b0a2e3a2204d0" }

[lints]
workspace = true
