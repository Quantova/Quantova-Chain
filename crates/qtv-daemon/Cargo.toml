[package]
name = "qtv-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The standalone Quantova validator daemon, quantovad. It carves the devnet node into a runnable process driven by a genesis file and a node config file, runs a continuous production round over the real qtv-net post quantum mesh, persists every finalised block through qtv-store, and resumes from disk on restart. A committee of one is its own supermajority, so a single quantovad is a live chain on its own."

[[bin]]
name = "quantovad"
path = "src/main.rs"

[dependencies]
# The account model, for deriving a funded genesis account's address from its
# scheme and public key.
qtv-account = { path = "../qtv-account" }

# The node engine: the genesis, the account and validator specs, the fee schedule,
# and the committee selection the daemon drives. No test fixtures, so the daemon binary
# carries no path that turns a validator id into key material.
qtv-node = { path = "../qtv-node" }

# The block model, for the header arbitrary data limit the daemon checks a note
# against before handing it to the node.
qtv-block = { path = "../qtv-block" }

# The real post quantum secure channel the mesh is built from.
qtv-net = { path = "../qtv-net" }

# The devnet node and its round primitives. The daemon reuses DevNode as the one
# node core rather than forking it, and drives it over a continuous production loop
# instead of the harness measurement loop. No test fixtures on this path.
qtv-devnet = { path = "../qtv-devnet" }

# The RPC gateway. The daemon runs it in process as a thread, feeding client requests
# to the round loop over a channel so the node stays the single owner of its state.
qtv-gateway = { path = "../qtv-gateway" }

# The audited post quantum crypto, for the SHA3 that fixes the genesis hash a chain
# id is bound through. Pinned at the same tag the rest of the graph uses.
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "21e28f1ffd1ca46a7144136c483618b18cd29bae" }
